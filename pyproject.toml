[project]
name = "renthunt"
version = "0.1.0"
description = "Local, semi-autonomous rental listing hunter for the Merrimack Valley"
requires-python = ">=3.11"
authors = [{ name = "Draygen aka Brian Wallace" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]  # only for watched pages that need JavaScript

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["renthunt", "renthunt.sources"]

[tool.setuptools.package-data]
renthunt = ["static/*"]
